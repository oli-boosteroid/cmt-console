# CMT Console on the VM.
#   docker compose -f docker-compose.vm.yml up -d --build
#   docker compose -f docker-compose.vm.yml --profile tunnel up -d --build   # with Cloudflare Tunnel
# The console listens on 127.0.0.1:8080. Secrets are in deploy/*.env on the VM.
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  cmt-console:
    <<: *hardening
    build: .
    image: cmt-console:latest
    container_name: cmt-console
    command: ["python", "console_app.py"]
    env_file: ./deploy/console.env
    environment: { PORT: "8080" }
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 512m
    cpus: 1.0
    networks: [cmt]

  cloudflared:
    <<: *hardening
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.12.2
    container_name: cmt-cloudflared
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ./deploy/cloudflared.env
    mem_limit: 128m
    cpus: 0.5
    networks: [cmt]

networks:
  cmt:
    name: cmt-net          # shared with the bot (its docker-compose.yml creates it): Jira gateway at cmt-boost:7001
    external: true
